name: CI — Le Tour de Dour (IONOS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Linux image
        run: docker build -t tourdedour-ci .
      - name: Verify startup and public routes
        run: |
          docker run -d --name tourdedour-ci -p 127.0.0.1:18080:8080 tourdedour-ci
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/
          curl --fail http://127.0.0.1:18080/tour-de-dour
          curl --fail http://127.0.0.1:18080/mascotte
      - name: Stop the test container
        if: always()
        run: docker rm -f tourdedour-ci || true
