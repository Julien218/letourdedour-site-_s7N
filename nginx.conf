worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  resolver 1.1.1.1 8.8.8.8 valid=300s;

  server {
    listen ${PORT} default_server;
    root /app;
    index index.html;

    location = / { return 301 /tour-de-dour; }

    location = /tour-de-dour {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      try_files /tour-de-dour.html =404;
    }

    location = /mascotte {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      try_files /mascotte.html =404;
    }
    location = /mascotte/ { return 301 /mascotte; }

    location = /canari {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      try_files /mascotte.html =404;
    }
    location = /canari/ { return 301 /canari; }

    # Mini-app ultra-courte pour les partages Facebook / Instagram / QR.
    location = /canari/participer {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      try_files /canari-participer.html =404;
    }
    location = /canari/participer/ { return 301 /canari/participer; }

    location = /api/mascotte-suggestions {
      proxy_ssl_server_name on;
      proxy_set_header Host rzvvwcwyaddzsaattwqt.supabase.co;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_pass https://rzvvwcwyaddzsaattwqt.supabase.co/functions/v1/tour-de-dour-name-suggestion;
      proxy_read_timeout 20s;
      add_header Cache-Control "no-store" always;
    }

    location / {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri /tour-de-dour.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
  }
}
