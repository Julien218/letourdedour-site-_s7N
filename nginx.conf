worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  resolver 1.1.1.1 8.8.8.8 valid=300s;

  server {
    listen ${PORT} default_server;
    root /app;
    index index.html;

    # Redirection racine → /tour-de-dour
    location = / {
      return 301 /tour-de-dour;
    }

    # Page principale Tour de Dour
    location = /tour-de-dour {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      try_files /tour-de-dour.html =404;
    }

    # Nouvelle page de la mascotte et collecte des prénoms
    location = /mascotte {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      try_files /mascotte.html =404;
    }

    location = /mascotte/ {
      return 301 /mascotte;
    }

    # Alias public du Canari vers la page mascotte existante.
    # L'URL /canari reste visible et sert directement le même contenu.
    location = /canari {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      try_files /mascotte.html =404;
    }

    location = /canari/ {
      return 301 /canari;
    }

    # Relais même origine vers Supabase : évite les erreurs CORS du formulaire
    # sur le domaine public comme sur l'URL de prévisualisation Railway.
    location = /api/mascotte-suggestions {
      proxy_ssl_server_name on;
      proxy_set_header Host rzvvwcwyaddzsaattwqt.supabase.co;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_pass https://rzvvwcwyaddzsaattwqt.supabase.co/functions/v1/tour-de-dour-name-suggestion;
      proxy_read_timeout 20s;
      add_header Cache-Control "no-store" always;
    }

    # Assets statiques
    location / {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri /tour-de-dour.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
  }
}
