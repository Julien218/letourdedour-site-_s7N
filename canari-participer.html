<!doctype html>
<html lang="fr-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Choisissez mon prénom ! — Le Tour de Dour</title>
  <meta name="description" content="Votez pour le prénom final du Canari du Tour de Dour.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.letourdedour.com/canari/participer">
  <meta property="og:title" content="🐤 Choisissez mon prénom !">
  <meta property="og:description" content="Dourix, Sammy, Doury, Grisou ou Doudou : à vous de choisir !">
  <meta property="og:image" content="https://www.letourdedour.com/assets/mascotte-stade.webp">
  <meta name="theme-color" content="#082638">
  <script>
    const API='/api/mascotte-name-vote',form=document.getElementById('nameForm'),msg=document.getElementById('msg'),count=document.getElementById('count'),btn=document.getElementById('submitBtn');
    async function loadCount(){try{const r=await fetch(API,{cache:'no-store'}),d=await r.json();count.textContent=d.ok?Number(d.count)||0:'—'}catch(e){count.textContent='—'}} loadCount();
    form.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';msg.textContent='';const selected=form.querySelector('input[name="selected_name"]:checked');if(!selected){msg.className='msg err';msg.textContent='Choisissez l’un des cinq prénoms.';return}btn.disabled=true;btn.textContent='VOTE EN COURS…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selected_name:selected.value,website:form.website.value})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.message||'Vote impossible.');form.style.display='none';document.getElementById('after').classList.add('show')}catch(err){msg.className='msg err';msg.textContent=err.message||'Réessayez dans quelques instants.'}finally{btn.disabled=false;btn.textContent='VOTER POUR CE PRÉNOM →'}});
  </script>
</body>
</html>
