<!doctype html><html lang="fr-BE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Choisissez mon prénom ! — Le Tour de Dour</title><meta name="description" content="Vote final du prénom du Canari du Tour de Dour."><meta name="theme-color" content="#082638"><style>
:root{--gold:#f6c928;--blue:#123f5b;--ink:#082638;--paper:#fffdf3;--muted:#64727a;--line:#e8dfb7;--err:#b62f38}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}body{min-height:100dvh;background:#06131d}.layer{min-height:100dvh;display:grid;place-items:center;padding:18px}.card{position:relative;width:min(100%,430px);background:var(--paper);border-radius:26px;padding:24px;box-shadow:0 28px 90px #0008}.close{position:absolute;right:14px;top:14px;width:38px;height:38px;border:0;border-radius:50%;background:#eef0e8;color:var(--ink);font-size:22px;text-decoration:none;display:grid;place-items:center}.head{padding:8px 58px 20px 4px}.head h1{margin:5px 0 8px;font-size:1.55rem}.head p{margin:0;color:var(--blue);font-size:.86rem;font-weight:700;line-height:1.4}.choices{display:grid;gap:10px;margin:8px 0 20px}.choice{display:flex;align-items:center;gap:13px;border:2px solid var(--line);border-radius:15px;padding:14px;background:#fff;cursor:pointer;font-size:1.05rem;transition:.18s}.choice:hover,.choice:has(input:checked){border-color:var(--gold);box-shadow:0 0 0 4px #f6c92824;transform:translateY(-1px)}.choice input{width:21px;height:21px;accent-color:var(--blue)}.vote{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:900;font-size:.9rem;cursor:pointer}.vote:disabled{opacity:.55}.msg{text-align:center;min-height:20px;margin-top:10px;font-size:.8rem;font-weight:700}.err{color:var(--err)}.count{text-align:center;color:var(--muted);font-size:.72rem;margin-top:16px}.count strong{color:var(--blue);font-size:.95rem}.after{display:none;text-align:center;padding:25px 5px}.after.show{display:block}.after h2{color:var(--blue);font-size:1.5rem;margin:5px}.fine{text-align:center;color:#7d765d;font-size:.64rem;margin-top:18px}.honey{position:absolute;left:-10000px}html.embed body{background:transparent}html.embed .layer{min-height:auto;padding:0}html.embed .card{width:100%;box-shadow:none}html.embed .close{display:none}@media(max-width:480px){.layer{padding:10px}.card{padding:20px 16px}.head{padding-right:48px}}
</style></head><body><main class="layer"><section class="card"><a class="close" href="/mascotte" aria-label="Fermer">×</a><header class="head"><h1>Choisissez mon prénom !</h1><p>Merci pour toutes vos suggestions 💛<br>Il reste maintenant 5 prénoms finalistes.</p></header><form id="nameForm"><div class="choices">
<label class="choice"><input type="radio" name="selected_name" value="Dourix" required><strong>Dourix</strong></label>
<label class="choice"><input type="radio" name="selected_name" value="Sammy"><strong>Sammy</strong></label>
<label class="choice"><input type="radio" name="selected_name" value="Doury"><strong>Doury</strong></label>
<label class="choice"><input type="radio" name="selected_name" value="Grisou"><strong>Grisou</strong></label>
<label class="choice"><input type="radio" name="selected_name" value="Doudou"><strong>Doudou</strong></label>
</div><div class="honey"><input name="website" tabindex="-1" autocomplete="off"></div><button class="vote" id="submitBtn" type="submit">VOTER POUR CE PRÉNOM →</button><div class="msg" id="msg" role="status"></div></form><div class="after" id="after"><img src="/assets/canari-mini-wave.png" alt="Mascotte officielle du Tour de Dour" style="width:120px;height:150px;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(8,38,56,.25))"><h2>Merci !</h2><p>Votre vote est enregistré.<br>Vous m'aidez à choisir mon prénom !</p></div><div class="fine">Le Tour de Dour · Vote final du prénom de la mascotte</div></section></main><script>
const API='/api/mascotte-name-vote',form=document.getElementById('nameForm'),msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');form.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';msg.textContent='';const selected=form.querySelector('input[name="selected_name"]:checked');if(!selected){msg.className='msg err';msg.textContent='Choisissez un prénom.';return}btn.disabled=true;btn.textContent='VOTE EN COURS…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selected_name:selected.value,website:form.website.value})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.message||'Vote impossible.');form.style.display='none';document.getElementById('after').classList.add('show')}catch(err){msg.className='msg err';msg.textContent=err.message||'Réessayez.'}finally{btn.disabled=false;btn.textContent='VOTER POUR CE PRÉNOM →'}});
</script></body></html>
