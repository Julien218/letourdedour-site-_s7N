<!doctype html><html lang="fr-BE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Choisissez mon prénom ! — Le Tour de Dour</title><meta name="description" content="Vote final du prénom du Canari du Tour de Dour."><meta name="theme-color" content="#082638"><style>
:root{--gold:#f6c928;--blue:#123f5b;--ink:#082638;--paper:#fffdf3;--muted:#64727a;--line:#e8dfb7;--err:#b62f38}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}body{min-height:100dvh;background:#06131d}.layer{min-height:100dvh;display:grid;place-items:center;padding:18px}.card{position:relative;width:min(100%,520px);background:linear-gradient(160deg,#fffdf3 0%,#fffaf0 100%);border:1px solid rgba(246,201,40,.45);border-radius:28px;padding:30px;box-shadow:0 28px 90px #0008,0 0 0 1px rgba(255,255,255,.5) inset}.close{position:absolute;right:14px;top:14px;width:38px;height:38px;border:0;border-radius:50%;background:#eef0e8;color:var(--ink);font-size:22px;text-decoration:none;display:grid;place-items:center}.head{padding:6px 58px 24px 2px}.head h1{margin:4px 0 10px;font-size:1.7rem;line-height:1.12;letter-spacing:-.025em}.head p{margin:0;color:#35586c;font-size:.9rem;font-weight:600;line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 22px}.choices .choice:last-child{grid-column:1/-1}.choice{display:flex;align-items:center;gap:12px;border:1.5px solid #e7d8a3;border-radius:16px;padding:15px 16px;background:rgba(255,255,255,.82);cursor:pointer;font-size:1rem;transition:.18s;min-height:58px}.choice:hover,.choice:has(input:checked){border-color:var(--gold);box-shadow:0 0 0 4px #f6c92824;transform:translateY(-1px)}.choice input{width:21px;height:21px;accent-color:var(--blue)}.vote{width:100%;min-height:58px;border:0;border-radius:16px;background:linear-gradient(135deg,#123f5b,#0a2c40);color:#fff;font-weight:900;font-size:.9rem;letter-spacing:.025em;cursor:pointer;box-shadow:0 12px 24px rgba(18,63,91,.2)}.vote:disabled{opacity:.55}.msg{text-align:center;min-height:20px;margin-top:10px;font-size:.8rem;font-weight:700}.err{color:var(--err)}.count{text-align:center;color:var(--muted);font-size:.72rem;margin-top:16px}.count strong{color:var(--blue);font-size:.95rem}.after{display:none;text-align:center;padding:25px 5px}.after.show{display:block}.after h2{color:var(--blue);font-size:1.5rem;margin:5px}.fine{text-align:center;color:#7d765d;font-size:.64rem;margin-top:18px}.honey{position:absolute;left:-10000px}html.embed body{background:transparent}html.embed .layer{min-height:auto;padding:0}html.embed .card{width:100%;box-shadow:none}html.embed .close{display:none}@media(max-width:480px){.layer{padding:8px}.card{padding:22px 16px;border-radius:22px}.head{padding-right:44px}.head h1{font-size:1.45rem}.choices{grid-template-columns:1fr;gap:9px}.choices .choice:last-child{grid-column:auto}.choice{min-height:52px;padding:12px 14px}}
</style></head><body><main class="layer"><section class="card"><a class="close" href="/mascotte" aria-label="Fermer">×</a><header class="head"><div style="font-size:.7rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#b98216;margin-bottom:8px">Vote final</div><h1>À vous de choisir mon prénom !</h1><p>Grâce à toutes vos suggestions, <strong>5 prénoms sont arrivés en finale.</strong><br>Choisissez votre préféré.</p></header><form id="nameForm"><div class="choices">
<label class="choice"><input type="radio" name="selected_name" value="Dourix" required><strong>Dourix</strong></label>
<label class="choice"><input type="radio" name="selected_name" value="Sammy"><strong>Sammy</strong></label>
<label class="choice"><input type="radio" name="selected_name" value="Doury"><strong>Doury</strong></label>
<label class="choice"><input type="radio" name="selected_name" value="Grisou"><strong>Grisou</strong></label>
<label class="choice"><input type="radio" name="selected_name" value="Doudou"><strong>Doudou</strong></label>
</div><div class="honey"><input name="website" tabindex="-1" autocomplete="off"></div><button class="vote" id="submitBtn" type="submit">JE VOTE POUR CE PRÉNOM →</button><div class="msg" id="msg" role="status"></div></form><div class="after" id="after"><img src="/assets/canari-mini-wave.png" alt="Mascotte officielle du Tour de Dour" style="width:120px;height:150px;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(8,38,56,.25))"><h2>Merci pour votre vote !</h2><p>Votre choix est bien enregistré 💛<br><strong>Bientôt, grâce à vous, j’aurai enfin mon prénom !</strong></p></div><div class="fine">Le Tour de Dour · Notre ville en mouvement</div></section></main><script>
const API='/api/mascotte-name-vote',form=document.getElementById('nameForm'),msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');form.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';msg.textContent='';const selected=form.querySelector('input[name="selected_name"]:checked');if(!selected){msg.className='msg err';msg.textContent='Choisissez un prénom.';return}btn.disabled=true;btn.textContent='VOTE EN COURS…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selected_name:selected.value,website:form.website.value})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.message||'Vote impossible.');form.style.display='none';document.getElementById('after').classList.add('show')}catch(err){msg.className='msg err';msg.textContent=err.message||'Réessayez.'}finally{btn.disabled=false;btn.textContent='VOTER POUR CE PRÉNOM →'}});
</script></body></html>
